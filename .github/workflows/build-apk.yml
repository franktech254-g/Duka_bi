    def show_payment_screen():
        page.clean()
        phone_field = ft.TextField(label="M-Pesa Phone Number", hint_text="0712 345 678", value="07", keyboard_type=ft.KeyboardType.PHONE)
        status = ft.Text("", size=12, color="#334155")
        pay_btn = ft.ElevatedButton("PAY KSh 500 WITH M-PESA", bgcolor="#16A34A", color="white", width=float("inf"))

        def do_stk_push(e):
            phone = phone_field.value
            if len(phone) < 9:
                status.value = "❌ Enter valid phone number"
                page.update()
                return
            
            pay_btn.disabled = True
            pay_btn.text = "Sending STK..."
            status.value = "⏳ Connecting to M-Pesa Daraja..."
