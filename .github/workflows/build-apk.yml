CALLBACK_URL = "https://mydomain.com/callback"  # For testing, any https url works
USE_SANDBOX = True  # Set False for real money (production)

# ==========================================
# DARAJA FUNCTIONS - AUTO M-PESA
# ==========================================
def get_daraja_token():
    base = "https://sandbox.safaricom.co.ke" if USE_SANDBOX else "https://api.safaricom.co.ke"
    url = f"{base}/oauth/v1/generate?grant_type=client_credentials"
    auth = base64.b64encode(f"{DARAJA_CONSUMER_KEY}:{DARAJA_CONSUMER_SECRET}".encode()).decode()
    headers = {"Authorization": f"Basic {auth}"}
    res = requests.get(url, headers=headers, timeout=15)
    return res.json().get("access_token")

def stk_push(phone, amount=500):
    try:
        token = get_daraja_token()
        if not token:
            return {"ResponseCode": "1", "errorMessage": "Failed to get token - check Consumer Key/Secret"}
        
        timestamp = datetime.now().strftime("%Y%m%d%H%M%S")
        password = base64.b64encode(f"{MPESA_SHORTCODE}{MPESA_PASSKEY}{timestamp}".encode()).decode()
        
        # Format phone 07XX -> 2547XX
        phone = phone.strip().replace(" ", "")
        if phone.startswith("07"):
            phone = "254" + phone[1:]
        elif phone.startswith("7"):
            phone = "254" + phone
        elif phone.startswith("+254"):
            phone = phone[1:]

        base = "https://sandbox.safaricom.co.ke" if USE_SANDBOX else "https://api.safaricom.co.ke"
        url = f"{base}/mpesa/stkpush/v1/processrequest"
        headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
        
        payload = {
            "BusinessShortCode": MPESA_SHORTCODE,
            "Password": password,
            "Timestamp": timestamp,
            "TransactionType": "CustomerPayBillOnline",
            "Amount": int(amount),
            "PartyA": phone,
            "PartyB": MPESA_SHORTCODE,
            "PhoneNumber": phone,
            "CallBackURL": CALLBACK_URL,
            "AccountReference": "NYADORERA",
            "TransactionDesc": "Nyadorera Expenses Subscription"
        }
        res = requests.post(url, json=payload, headers=headers, timeout=20)
        return res.json()
    except Exception as ex:
        return {"ResponseCode": "1", "errorMessage": str(ex)}

# ==========================================
# DATABASE + TRIAL LOGIC
# ==========================================
def init_db():
    conn = sqlite3.connect(DB_FILE)
    c = conn.cursor()
    c.execute("CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT)")
    c.execute("CREATE TABLE IF NOT EXISTS expenses (id INTEGER PRIMARY KEY, date TEXT, desc TEXT, amount REAL)")
    c.execute("CREATE TABLE IF NOT EXISTS sales (id INTEGER PRIMARY KEY, date TEXT, amount REAL)")
    c.execute("SELECT value FROM settings WHERE key='install_date'")
    if not c.fetchone():
        today = datetime.now().strftime("%Y-%m-%d")
        c.execute("INSERT INTO settings VALUES ('install_date', ?)", (today,))
        c.execute("INSERT INTO settings VALUES ('is_paid', '0')")
        c.execute("INSERT INTO settings VALUES ('last_checkout_id', '')")
    conn.commit()
    conn.close()

def check_subscription():
    conn = sqlite3.connect(DB_FILE)
    c = conn.cursor()
    c.execute("SELECT value FROM settings WHERE key='install_date'")
    row = c.fetchone()
    install_date = datetime.strptime(row[0], "%Y-%m-%d") if row else datetime.now()
    c.execute("SELECT value FROM settings WHERE key='is_paid'")
    is_paid = (c.fetchone() or ["0"])[0] == "1"
    conn.close()
    if is_paid:
        return True, 0, "PAID ✅"
    days_left = 30 - (datetime.now() - install_date).days
    if days_left > 0:
        return True, days_left, f"TRIAL - {days_left} days left"
    return False, 0, "EXPIRED ❌"

