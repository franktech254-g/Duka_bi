                conn.execute("UPDATE settings SET value=? WHERE key='last_checkout_id'", (checkout_id,))
                conn.commit()
                conn.close()

                status.value = f"✅ STK Push sent to {phone}!\nCheck your phone → Enter M-Pesa PIN\n\nAfter paying, click VERIFY below"
                pay_btn.text = "VERIFY PAYMENT"
                pay_btn.bgcolor = "#2563EB"
                pay_btn.disabled = False
